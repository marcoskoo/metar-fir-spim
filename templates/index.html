<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FIR SPIM - METAR/TAF/NOTAM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',Consolas,monospace;background:#0d1117;color:#c9d1d9;font-size:13px;line-height:1.5}
.c{max-width:1200px;margin:0 auto;padding:12px}
.hd{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hd h1{color:#58a6ff;font-size:16px;font-weight:400}
.hd p{color:#8b949e;font-size:11px}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:#8b949e}
.ct{width:8px;height:8px;border-radius:50%;display:inline-block}
.ct.g{background:#3fb950}.ct.y{background:#d29922}.ct.r{background:#f85149}
.sb{margin-bottom:10px}
.sb input{width:100%;padding:7px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-family:'Courier New',monospace;font-size:12px;outline:none}
.sb input:focus{border-color:#58a6ff}
.sb input::placeholder{color:#484f58}
.sm{color:#8b949e;font-size:11px;padding:6px 0;border-bottom:1px solid #21262d;margin-bottom:8px}
.sc{color:#58a6ff;font-size:13px;font-weight:600;padding:8px 0 4px;border-bottom:1px solid #21262d;margin-bottom:6px;margin-top:14px}
.grp{margin-bottom:4px}
.grp-hdr{color:#f0f6fc;background:#161b22;padding:5px 10px;border:1px solid #30363d;border-radius:4px;margin-bottom:2px;font-size:12px;display:flex;justify-content:space-between}
.grp-hdr .ac{color:#8b949e;font-size:11px}
.ln{padding:4px 10px;white-space:pre-wrap;word-break:break-word;color:#c9d1d9;border-left:2px solid #30363d;margin-left:4px;margin-bottom:2px;font-size:12px}
.ln.m{border-left-color:#58a6ff}
.ln.t{border-left-color:#d29922}
.ln.n{border-left-color:#bc8cff}
.ft{text-align:center;font-size:10px;color:#484f58;padding:16px 0;border-top:1px solid #21262d;margin-top:12px}
.ft a{color:#58a6ff}
.em{color:#484f58;text-align:center;padding:30px 0;font-size:12px}
@media(max-width:600px){
.c{padding:8px}.hd{padding:10px 12px}.hd h1{font-size:14px}.ln{font-size:11px;padding:3px 8px}
}
</style>
</head>
<body>
<div class="c">
<div class="hd">
<div><h1># FIR SPIM</h1><p>METAR / TAF / NOTAM &middot; datos crudos</p></div>
<div class="st"><span class="ct g" id="dot"></span><span id="st">cargando...</span></div>
</div>
<div class="sb"><input type="text" id="f" placeholder="filtrar por aerodromo (SPJC, SPQT, lima...)" oninput="render()"></div>
<div id="x"></div>
<div class="ft">
<a href="https://github.com/marcoskoo/metar-fir-spim">github</a> &middot;
<a href="https://meteorologia.corpac.gob.pe">CORPAC</a> &middot;
<a href="https://notam-alarm.up.railway.app">NOTAM Alarm</a> &middot;
actualiza cada 60s
</div>
</div>
<script>
var TOTAL={{ airport_count }};
var M={results:[],count:0,total:TOTAL};
var N={notams:[]};

function fmt(d){return d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function st(t,m){document.getElementById('dot').className='ct '+t;document.getElementById('st').textContent=m}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function filt(r){
  var q=document.getElementById('f').value.trim().toLowerCase();
  if(!q)return true;
  var c=(r.code||r.location||r.name||'').toLowerCase();
  return c.indexOf(q)!==-1;
}

function render(){
  var h='';var aero=M.results||[];var nota=N.notams||[];
  var fa=aero.filter(filt);
  h+='<div class="sc">;; METAR / TAF</div>';
  if(fa.length){
    h+='<div class="sm">'+fa.length+' aeropuertos</div>';
    for(var i=0;i<fa.length;i++){
      var o=fa[i];
      h+='<div class="grp"><div class="grp-hdr"><span>'+esc(o.code)+' '+esc(o.name)+'</span></div>';
      h+='<div class="ln m">'+esc(o.metar)+'</div>';
      if(o.taf)h+='<div class="ln t">'+esc(o.taf)+'</div>';
      h+='</div>';}
  }else{h+='<div class="em">sin datos</div>';}

  var fn=nota.filter(filt);
  h+='<div class="sc">;; NOTAM</div>';
  if(fn.length){
    var grp={},codes=[];
    fn.forEach(function(n){var c=n.location||'ZZZZ';if(!grp[c]){grp[c]=[];codes.push(c)}grp[c].push(n)});
    codes.sort();
    h+='<div class="sm">'+fn.length+' NOTAMs en '+codes.length+' aerodromos</div>';
    for(var ci=0;ci<codes.length;ci++){
      var cc=codes[ci],nn=grp[cc];
      h+='<div class="grp"><div class="grp-hdr"><span>'+esc(cc)+'</span><span class="ac">'+nn.length+' NOTAMs</span></div>';
      for(var ni=0;ni<nn.length;ni++){
        h+='<div class="ln n">'+esc(nn[ni].raw_text||nn[ni].text||nn[ni].id||'')+'</div>';}
      h+='</div>';}
  }else{h+='<div class="em">sin datos</div>';}
  document.getElementById('x').innerHTML=h;
}

function fetchM(){
  fetch('/api/metar').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){M=d;render();st('g',fmt(new Date()))}).catch(function(e){st('r','m: '+e.message)})
}
function fetchN(){
  fetch('/api/notams').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){N=d;render();st('g',fmt(new Date()))}).catch(function(e){st('r','n: '+e.message)})
}
function load(){st('y','...');fetchM();fetchN()}
load();setInterval(load,60000);
</script>
</body>
</html>
